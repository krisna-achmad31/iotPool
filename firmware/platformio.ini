; Alternatif Arduino IDE: PlatformIO (VS Code). Memakai pioarduino karena
; platform PlatformIO resmi belum menyediakan arduino-esp32 3.x.
[platformio]
src_dir = sysnergi_hub

[env:sysnergi_hub]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = sysnergi_hub/partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  bblanchon/ArduinoJson@^7.4.3
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^4.0.6
